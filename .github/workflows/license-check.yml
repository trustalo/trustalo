name: License compliance

# Constraint C1 (operational half): every dependency in the resolved
# tree must carry a permissive license that does not relicense Trustalo.
# The script in scripts/license-check.ts walks the entire installed
# dependency graph (including Bun's flat .bun/ layout) and verifies
# each package is on the allowlist or has a documented exception.
#
# Run locally with: bun run license:check
# Reviewer-friendly summary: bun run license:report

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: License compliance check
        run: bun run license:check

      - name: License distribution (informational)
        if: always()
        run: bun run license:report || true
