name: Security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  coverage-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run coverage suite
        run: bun run test:coverage | tee coverage.log
      - name: Enforce minimum 75% line coverage
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const text = fs.readFileSync("coverage.log", "utf8");
          const re = /All files\s*\|\s*([0-9.]+)\s*\|\s*([0-9.]+)\s*\|/g;
          const rows = [];
          let m;
          while ((m = re.exec(text)) !== null) {
            rows.push({
              funcs: Number.parseFloat(m[1]),
              lines: Number.parseFloat(m[2]),
            });
          }

          if (rows.length === 0) {
            console.error("Coverage gate: no `All files` rows found in coverage output.");
            process.exit(1);
          }

          const minLines = Math.min(...rows.map((r) => r.lines));
          console.log(`Coverage gate: found ${rows.length} package-level coverage row(s).`);
          rows.forEach((row, i) => {
            console.log(`  row ${i + 1}: lines=${row.lines.toFixed(2)}% funcs=${row.funcs.toFixed(2)}%`);
          });

          if (minLines < 75) {
            console.error(`Coverage gate failed: minimum line coverage is ${minLines.toFixed(2)}%, required >= 75.00%.`);
            process.exit(1);
          }

          console.log(`Coverage gate passed: minimum line coverage is ${minLines.toFixed(2)}% (>= 75.00%).`);
          EOF

  dependency-review:
    # The action requires both Dependency Graph and GitHub Advanced Security.
    # GHAS is free on public repos and a paid add-on on private repos, so we
    # skip the job on private repos that don't have it (would otherwise fail
    # with "Dependency review is not supported on this repository").
    # `bun audit` already provides equivalent CVE coverage for every push/PR.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4

  secrets-scan:
    runs-on: ubuntu-latest
    # We invoke the open-source `gitleaks` binary directly instead of
    # `gitleaks/gitleaks-action`. The action started requiring a paid
    # license key for organization-owned repos in v2.3.x (see
    # https://github.com/gitleaks/gitleaks-action#-announcement); the
    # CLI itself remains MIT-licensed and free. Read-only checkout is
    # enough — failures surface via the check status, no PR comment.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Shallow checkout is sufficient: we scan the working tree
        # (--no-git), not the commit history. Branch protection
        # requiring this check to pass prevents any leak from ever
        # entering the tree on main.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "/tmp/${tarball}" -C "${HOME}/.local/bin" gitleaks
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/gitleaks" version
      - name: Gitleaks scan (working tree)
        run: |
          gitleaks detect \
            --source . \
            --no-git \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1

  bun-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit
