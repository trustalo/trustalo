name: trustalo

services:
  postgres:
    image: postgres:17
    container_name: trustalo-postgres
    environment:
      POSTGRES_USER: trustalo
      POSTGRES_PASSWORD: trustalo
      POSTGRES_DB: trustalo_api
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustalo"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    container_name: trustalo-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: trustalo
      MONGO_INITDB_ROOT_PASSWORD: trustalo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    # Pinned to v3 — the last LocalStack CE release that runs without a
    # LOCALSTACK_AUTH_TOKEN. Newer images (2026.x) refuse to start without one
    # and exit with code 55 ("license activation failed").
    image: localstack/localstack:3
    container_name: trustalo-localstack
    environment:
      SERVICES: s3,sqs
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh

volumes:
  pg_data:
  mongo_data:
  localstack_data:
